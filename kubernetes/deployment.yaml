apiVersion: apps/v1
kind: Deployment
metadata:
  name: invoicer-app
  namespace: default
  labels:
    app: invoicer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: invoicer
  template:
    metadata:
      labels:
        app: invoicer
    spec:
      containers:
      - name: invoicer
        image: invoicer:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: invoicer-config
        - secretRef:
            name: invoicer-secrets
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
