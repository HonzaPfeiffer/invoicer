apiVersion: v1
kind: Service
metadata:
  name: {{ include "invoicer.fullname" . }}-service
  labels:
    {{- include "invoicer.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "invoicer.selectorLabels" . | nindent 4 }}
  ports:
    - protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
