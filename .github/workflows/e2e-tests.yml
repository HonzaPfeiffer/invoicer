name: E2E Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Create .env file for tests
      run: |
        cat > .env << EOF
        DATABASE_URL=postgresql://postgres:postgres@localhost:5432/invoicer_test
        NEXTAUTH_SECRET=test-secret-key-for-ci
        NEXTAUTH_URL=http://localhost:3000
        NODE_ENV=test
        EOF

    - name: Start services with Docker Compose
      run: docker-compose up -d
      env:
        COMPOSE_FILE: docker-compose.yml

    - name: Wait for services to be ready
      run: |
        echo "Waiting for PostgreSQL..."
        timeout 60 bash -c 'until docker-compose exec -T db pg_isready -U postgres; do sleep 2; done'
        echo "Waiting for application..."
        timeout 120 bash -c 'until curl -f http://localhost:3000 > /dev/null 2>&1; do sleep 2; done'

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium

    - name: Run database migrations
      run: npx prisma migrate deploy

    - name: Seed test database (optional)
      run: npx prisma db seed || echo "No seed script found"

    - name: Run E2E tests
      run: npm run test:e2e
      env:
        BASE_URL: http://localhost:3000

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: test-results/
        retention-days: 30

    - name: Upload Cucumber HTML report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: cucumber-report
        path: test-results/cucumber-report.html
        retention-days: 30

    - name: Upload screenshots on failure
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: screenshots
        path: test-results/screenshots/
        retention-days: 7

    - name: Upload videos on failure
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: videos
        path: test-results/videos/
        retention-days: 7

    - name: Show Docker Compose logs on failure
      if: failure()
      run: docker-compose logs

    - name: Stop Docker Compose services
      if: always()
      run: docker-compose down -v
